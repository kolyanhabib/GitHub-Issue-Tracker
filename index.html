<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issue Tracker</title>

    <!-- DaisyUI and Tailwind  -->

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>

    
    <!-- Loader -->

    <div
      id="loader"
      class="fixed flex inset-0 items-center justify-center bg-white z-50 hidden"
    >
      <span class="loading loading-spinner loading-lg text-purple-600"></span>
    </div>

    <!-- HEADER -->

    <header class="bg-white border-b border-[#E9E9E9]">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4"
      >
        <div class="flex items-center gap-3">
          <i class="fa-brands fa-github text-4xl"></i>

          <h1 class="text-lg md:text-2xl font-semibold text-gray-800">
            GitHub Issues Tracker
          </h1>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
          <input
            id="searchInput"
            type="search"
            placeholder="Search issues..."
            class="input input-bordered w-full sm:w-64"
          />

          <button id="searchBtn" class="btn bg-[#4A00FF] text-white">
            <i class="fa-solid fa-plus"></i> New Issue
          </button>
        </div>
      </div>
    </header>

    <!-- Modal -->

    <dialog id="issueModal" class="modal">
      <div class="modal-box max-w-2xl space-y-4">
        <h2 id="modalTitle" class="text-xl font-bold"></h2>

        <div class="flex items-center gap-2 text-sm">
          <span
            id="modalStatus"
            class="px-3 py-1 rounded-full text-white"
          ></span>

          <span id="modalAuthor"></span>

          <span id="modalDate"></span>
        </div>

        <div id="modalLabels" class="flex gap-2 flex-wrap"></div>

        <p id="modalDescription" class="text-gray-500"></p>

        <div class="bg-gray-100 rounded-xl p-4 grid grid-cols-2 gap-4">
          <div>
            <p class="text-gray-500 text-sm">Assignee:</p>

            <p id="modalAssignee" class="font-semibold"></p>
          </div>

          <div>
            <p class="text-gray-500 text-sm">Priority:</p>

            <span
              id="modalPriority"
              class="mt-2 inline-block px-3 py-1 rounded-full text-white text-sm"
            ></span>
          </div>
        </div>

        <div class="modal-action">
          <button
            onclick="issueModal.close()"
            class="btn bg-purple-600 text-white"
          >
            Close
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>
